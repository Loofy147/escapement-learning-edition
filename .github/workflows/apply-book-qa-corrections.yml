name: apply-book-qa-corrections
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/learning-intelligence-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Apply deterministic book QA corrections v2
        run: node scripts/apply-book-qa-corrections-v2.mjs
      - name: Validate manuscript diff
        run: |
          git diff --check
          git diff -- client/src/content/book.md
      - name: Commit corrected manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/content/book.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: apply Escapement Book QA v2 corrections"
          git push origin HEAD:feat/learning-intelligence-v1
