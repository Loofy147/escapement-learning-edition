name: apply-book-qa-corrections
on:
  push:
    branches: [feat/learning-intelligence-v1]
permissions:
  contents: write
jobs:
  apply:
    if: startsWith(github.event.head_commit.message, '[apply-book-qa]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/apply-book-qa-corrections.mjs
      - run: git diff --check
      - name: Commit corrected manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/content/book.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: apply Escapement book QA corrections"
          git push
