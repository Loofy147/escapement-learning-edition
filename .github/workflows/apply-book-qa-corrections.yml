name: apply-book-qa-corrections
on:
  push:
    branches: [feat/learning-intelligence-v1]
permissions:
  contents: write
jobs:
  apply:
    if: startsWith(github.event.head_commit.message, '[apply-book-qa]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic book QA corrections
        run: node scripts/apply-book-qa-corrections.mjs
      - name: Validate manuscript diff
        run: |
          git diff --check
          git diff -- client/src/content/book.md
      - name: Commit corrected manuscript
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/content/book.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: apply Escapement book QA corrections"
          git push
